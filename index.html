<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TaterOS</title>
  <meta name="description" content="GoTater — some simple apps. Have fun.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥔</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="os/os.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/Draggable.min.js"></script>
  <script type="module" src="os/main.js"></script>
</head>
<body>
  <canvas id="wallpaper" aria-hidden="true"></canvas>

  <main id="desktop" aria-label="Desktop"></main>
  <div id="windows"></div>

  <nav id="taskbar" aria-label="Taskbar">
    <button id="start-btn" class="bevel" aria-haspopup="menu" aria-expanded="false"><span>🥔</span><b>Start</b></button>
    <div id="tasks"></div>
    <div id="tray" class="bevel-in"><span id="tray-run" title="Run… ( / )">🔎</span><time id="clock"></time></div>
  </nav>
  <div id="start-menu" class="bevel" role="menu" hidden></div>

  <div id="boot" hidden></div>
  <div id="screensaver" hidden></div>
  <noscript><p style="padding:2em;color:#fff">TaterOS needs JavaScript. Apps live at /apps/&lt;name&gt;/.</p></noscript>
</body>
</html>
