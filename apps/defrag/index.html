<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Disk Defragmenter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --face:#c3bdb2;--face-hi:#f3efe6;--face-lo:#7d766a;--face-dk:#2a2620;
  --ink:#1d1a16;--muted:#5b554b;--title-a:#6b3d14;--title-b:#c8893b;
  --bar:#0a2a8a;
  --pixel:'Pixelify Sans','VT323',ui-monospace,monospace;
  --mono:'VT323',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--face);color:var(--ink);font:13px/1.3 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  user-select:none;-webkit-user-select:none;display:flex;flex-direction:column}
button{font:inherit;color:inherit}
[hidden]{display:none!important}

.bevel{background:var(--face);border:0;
  box-shadow:inset -1px -1px var(--face-dk),inset 1px 1px var(--face-hi),inset -2px -2px var(--face-lo),inset 2px 2px var(--face)}
.bevel-in{background:var(--face);
  box-shadow:inset -1px -1px var(--face-hi),inset 1px 1px var(--face-lo),inset -2px -2px var(--face),inset 2px 2px var(--face-dk)}
button.bevel{cursor:pointer;min-width:84px;height:28px;padding:0 12px}
button.bevel:active,button.bevel.pressed{
  box-shadow:inset -1px -1px var(--face-hi),inset 1px 1px var(--face-dk),inset -2px -2px var(--face),inset 2px 2px var(--face-lo)}
button.bevel:focus-visible{outline:1px dotted var(--ink);outline-offset:-5px}
button.bevel:disabled{color:var(--face-lo);text-shadow:1px 1px var(--face-hi);cursor:default}

/* ---------- details view ---------- */
#details{flex:1;display:flex;flex-direction:column;min-height:0;padding:6px}
#mapWrap{flex:1;min-height:0;padding:3px;background:#fff}
#map{display:block;width:100%;height:100%}

#foot{flex:none;display:flex;gap:10px;align-items:flex-end;padding:8px 8px 6px;flex-wrap:wrap}
#foot .status{flex:1;min-width:220px}
.label{font-size:13px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:22px;padding:3px;display:flex;gap:2px;overflow:hidden}
.prog i{flex:none;width:9px;height:100%;background:var(--bar)}
.pct{font:18px var(--mono);margin-top:2px;color:var(--muted)}
.btns{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- compact view / dialogs ---------- */
#compact,#dlg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
  background:var(--face)}
#dlg{background:rgba(0,0,0,.25)}
.win{width:min(420px,100%);padding:3px}
.win .tb{height:24px;display:flex;align-items:center;gap:6px;padding:0 6px;
  background:linear-gradient(90deg,var(--title-a),var(--title-b));color:#fff8ea;font:600 14px var(--pixel)}
.win .body{padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px}
.win .row{display:flex;gap:12px;align-items:flex-start}
.win .big{font-size:30px;line-height:1}
.win .actions{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap;margin-top:4px}
select{font:inherit;height:26px;padding:0 4px;border:0;background:#fffdf8;color:var(--ink);width:100%;
  box-shadow:inset -1px -1px var(--face-hi),inset 1px 1px var(--face-lo),inset -2px -2px var(--face),inset 2px 2px var(--face-dk)}
.small{font-size:12px;color:var(--muted)}
label.chk{display:flex;gap:6px;align-items:center;cursor:pointer}

/* legend */
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12px}
.legend div{display:flex;gap:6px;align-items:center}
.legend canvas{flex:none;width:12px;height:14px}
@media (max-width:420px){.legend{grid-template-columns:1fr}}
</style>
</head>
<body>

<section id="details">
  <div id="mapWrap" class="bevel-in"><canvas id="map" aria-label="Drive cluster map"></canvas></div>
  <div id="foot">
    <div class="status">
      <div class="label" id="phase">Reading drive information...</div>
      <div class="prog bevel-in" id="prog"></div>
      <div class="pct" id="pct">0% Complete</div>
    </div>
    <div class="btns">
      <button class="bevel" id="stopBtn">Stop</button>
      <button class="bevel" id="pauseBtn">Pause</button>
      <button class="bevel" id="legendBtn">Legend</button>
      <button class="bevel" id="hideBtn">Hide Details</button>
    </div>
  </div>
</section>

<section id="compact" hidden>
  <div class="win bevel">
    <div class="tb">💽 Defragmenting Drive <span class="driveL">C</span></div>
    <div class="body">
      <div class="label" id="cphase"></div>
      <div class="prog bevel-in" id="cprog"></div>
      <div class="pct" id="cpct">0% Complete</div>
      <div class="actions">
        <button class="bevel" id="cstopBtn">Stop</button>
        <button class="bevel" id="cpauseBtn">Pause</button>
        <button class="bevel" id="showBtn">Show Details</button>
      </div>
    </div>
  </div>
</section>

<div id="dlg" hidden><div class="win bevel"><div class="tb" id="dlgTitle"></div><div class="body" id="dlgBody"></div></div></div>

<script>
const $ = s => document.querySelector(s);
const canvas = $('#map'), ctx = canvas.getContext('2d');

// cell states
const FREE = 0, FRAG = 1, OPT = 2, FIXED = 3, BAD = 4, READ = 5, WRITE = 6;
const COLORS = {
  [FREE]:  ['#ffffff', '#c8c8c8'],
  [FRAG]:  ['#28c8d8', '#08707c'],
  [OPT]:   ['#1838c0', '#08185c'],
  [FIXED]: ['#1838c0', '#08185c'],
  [BAD]:   ['#101010', '#000000'],
  [READ]:  ['#20c040', '#086018'],
  [WRITE]: ['#e82828', '#701010'],
};
const LEGEND = [
  [FRAG, 'Fragmented data'],
  [OPT, 'Optimized (defragmented) data'],
  [FIXED, "Data that won't be moved"],
  [BAD, 'Bad (damaged) area of the disk'],
  [FREE, 'Free space'],
  [READ, "Data that's being read"],
  [WRITE, "Data that's being written"],
];
const DRIVES = [
  { id: 'C', name: 'Drive C  (Physical drive)', used: .62, frag: .55 },
  { id: 'D', name: 'Drive D  (Tater Files)',    used: .84, frag: .8 },
  { id: 'A', name: 'Drive A  (3½ Floppy)',      used: .45, frag: .35, cells: 720 },
];
const SPEEDS = { 'Leisurely': .1, 'Normal': .3, 'Turbo': 1 }; // steps per frame

const Z = 2, CW = 9 * Z, CH = 11 * Z; // cell size incl. gap, Z = pixel scale
let cols = 0, rows = 0, cells = [], drive = DRIVES[0], speed = .3, stepAcc = 0;
let state = 'idle', paused = false, w = 0, job = null, totalWork = 1, doneWork = 0, scanLine = 0, tick = 0;
let loopMode = false;

/* ---------- drawing ---------- */
function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const wpx = Math.max(60, r.width - 6), hpx = Math.max(60, r.height - 6);
  canvas.style.width = wpx + 'px'; canvas.style.height = hpx + 'px';
  canvas.width = Math.round(wpx * dpr); canvas.height = Math.round(hpx * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const nc = Math.floor(wpx / CW);
  if (nc !== cols) {
    cols = nc;
    if (cells.length) rows = Math.ceil(cells.length / cols);
  }
  draw();
}

function drawCell(c, x, y, g = ctx) {
  const ctx = g, s = c.s, [fill, edge] = COLORS[s];
  // drawn on an unscaled 9x11 grid, each unit Z px
  const px = (u, v, w, h) => ctx.fillRect(x + u * Z, y + v * Z, w * Z, h * Z);
  ctx.fillStyle = edge; px(0, 0, 8, 10);
  ctx.fillStyle = fill; px(1, 1, 6, 8);
  if (s === FIXED) {
    ctx.fillStyle = '#fff';
    px(2, 2, 1, 1); px(5, 4, 1, 1); px(2, 6, 1, 1); px(5, 8, 1, 1);
  } else if (s === BAD) {
    ctx.fillStyle = '#e82828';
    for (let k = 0; k < 5; k++) { px(1 + k, 2 + k, 1, 1); px(6 - k - 1, 2 + k, 1, 1); }
  } else if (s === OPT || s === FRAG) {
    ctx.fillStyle = 'rgba(255,255,255,.25)'; px(1, 1, 6, 1);
  }
}

function draw() {
  const wpx = canvas.width / (window.devicePixelRatio || 1), hpx = canvas.height / (window.devicePixelRatio || 1);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, wpx, hpx);
  if (!cols) return;
  const maxRows = Math.floor(hpx / CH);
  // if the drive doesn't fit, each drawn cell summarizes several clusters
  const per = Math.max(1, Math.ceil(cells.length / (cols * maxRows)));
  const n = Math.ceil(cells.length / per);
  for (let k = 0; k < n; k++) {
    let c = cells[k * per];
    if (per > 1) { // show the most "interesting" state in the group
      for (let j = 1; j < per && k * per + j < cells.length; j++) {
        const o = cells[k * per + j];
        if (rank(o.s) > rank(c.s)) c = o;
      }
    }
    drawCell(c, (k % cols) * CW, Math.floor(k / cols) * CH);
  }
  if (state === 'read' || state === 'scan') {
    const y = Math.min(scanLine, Math.ceil(n / cols)) * CH;
    ctx.fillStyle = 'rgba(255,255,255,.72)'; ctx.fillRect(0, y, wpx, hpx - y);
  }
}
const rank = s => [0, 2, 1, 3, 4, 6, 7][s];

/* ---------- drive generation ---------- */
function makeDrive() {
  // pick a cluster count that fills the visible map nicely
  const hpx = canvas.height / (window.devicePixelRatio || 1);
  const fit = cols * Math.max(1, Math.floor(hpx / CH));
  const n = drive.cells ? Math.min(drive.cells, fit) : fit;
  cells = Array.from({ length: n }, () => ({ s: FREE, f: 0 }));
  const used = Math.floor(n * drive.used);
  let placed = 0, fid = 1, pos = 0;
  // lay files down in chunks with gaps, then shuffle some chunks around to fragment them
  while (placed < used && pos < n) {
    const len = 1 + Math.floor(Math.random() ** 2 * 40);
    for (let k = 0; k < len && pos < n && placed < used; k++, pos++, placed++) cells[pos] = { s: FRAG, f: fid };
    fid++;
    if (Math.random() < .5) pos += Math.floor(Math.random() * 6);
  }
  // scramble: swap random runs so free space is interleaved with data
  for (let k = 0; k < n * drive.frag; k++) {
    const a = Math.floor(Math.random() * n), b = Math.floor(Math.random() * n);
    [cells[a], cells[b]] = [cells[b], cells[a]];
  }
  // a few immovable system files and bad sectors
  const fixedRuns = 2 + Math.floor(Math.random() * 3);
  for (let k = 0; k < fixedRuns; k++) {
    const at = Math.floor(Math.random() * n * .9), len = 2 + Math.floor(Math.random() * 6);
    for (let j = at; j < at + len && j < n; j++) cells[j] = { s: FIXED, f: 0 };
  }
  for (let k = 0; k < 1 + Math.floor(Math.random() * 3); k++) cells[Math.floor(Math.random() * n)] = { s: BAD, f: 0 };
  // the very first clusters are usually already tidy
  for (let j = 0; j < Math.min(n, cols * 2) * .6; j++) if (cells[j].s === FRAG) cells[j].s = OPT;
  rows = Math.ceil(n / cols);
  w = 0; job = null; doneWork = 0;
  totalWork = cells.filter(c => c.s === FRAG).length || 1;
}

/* ---------- simulation ---------- */
// next movable data cluster after the write head, preferring the same file as the last one written
let lastFile = 0;
function findSource(from) {
  let first = -1;
  for (let i = from; i < cells.length; i++) {
    const c = cells[i];
    if (c.s !== FRAG) continue;
    if (c.f === lastFile) return i;
    if (first < 0) first = i;
    if (i - from > 600) break; // don't search forever, real heads didn't either
  }
  return first;
}

function step() {
  if (job) {
    job.t--;
    if (job.t > 0) return;
    if (job.kind === 'read') {
      cells[job.src].s = READ;
      cells[job.dst].s = WRITE;
      job.kind = 'write'; job.t = 2;
      return;
    }
    // finish the move
    const moved = cells[job.src];
    if (job.src !== job.dst) {
      cells[job.dst] = { s: OPT, f: moved.f };
      cells[job.src] = { s: FREE, f: 0 };
    } else {
      cells[job.dst].s = OPT;
    }
    lastFile = cells[job.dst].f;
    doneWork++; w = job.dst + 1; job = null;
    return;
  }
  while (w < cells.length && (cells[w].s === OPT || cells[w].s === FIXED || cells[w].s === BAD)) w++;
  if (w >= cells.length) return finish();
  const src = cells[w].s === FRAG && cells[w].f === lastFile ? w : findSource(w);
  if (src < 0) return finish();
  if (src === w) { // already in place, just verify it
    cells[w].s = READ; job = { kind: 'write', src: w, dst: w, t: 1 }; return;
  }
  if (cells[w].s === FRAG) { // something else is squatting here: bump it to the back
    const free = cells.findLastIndex((c, i) => i > w && c.s === FREE);
    if (free < 0) { cells[w].s = OPT; doneWork++; return; }
    cells[free] = cells[w]; cells[w] = { s: FREE, f: 0 };
  }
  cells[src].s = READ;
  job = { kind: 'read', src, dst: w, t: 2 };
}

function finish() {
  state = 'done';
  doneWork = totalWork;
  updateUI();
  draw();
  if (loopMode) { setTimeout(() => { if (state === 'done' && loopMode) begin(); }, 2500); return; }
  dialog('Disk Defragmenter', `<div class="row"><div class="big">💽</div><div>Defragmentation of Drive ${drive.id} is complete.<br><br>Do you want to defragment another drive?</div></div>`,
    [['Yes', () => openSelect()], ['No', () => {}]]);
}

let last = 0, acc = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(100, t - last); last = t;
  if (paused || state === 'idle' || state === 'done') return;
  tick++;
  if (state === 'read') {
    acc += dt;
    if (acc > 1400) { acc = 0; state = 'scan'; scanLine = 0; }
  } else if (state === 'scan') {
    acc += dt;
    if (acc > 70) { acc = 0; scanLine++; if (scanLine > rows + 1) state = 'defrag'; }
  } else {
    // a little stutter makes it feel like a real disk head
    if (Math.random() >= .04) stepAcc += speed;
    for (; stepAcc >= 1 && state === 'defrag'; stepAcc--) step();
  }
  updateUI();
  draw();
}

/* ---------- ui ---------- */
let lastBlocks = -1;
function updateUI() {
  const pct = state === 'defrag' || state === 'done' ? Math.floor(doneWork / totalWork * 100) : 0;
  const phase = state === 'idle' ? 'Click Start... to choose a drive' :
    paused ? 'Paused' :
    state === 'read' ? 'Reading drive information...' :
    state === 'scan' ? 'Checking drive for errors...' :
    state === 'done' ? `Drive ${drive.id} is not fragmented` :
    `Defragmenting file structure...`;
  const label = state === 'defrag' && !paused ? `Defragmenting Drive ${drive.id}` : phase;
  $('#phase').textContent = label;
  $('#cphase').textContent = label;
  $('#pct').textContent = $('#cpct').textContent = pct + '% Complete';
  for (const bar of [$('#prog'), $('#cprog')]) {
    const max = Math.floor((bar.clientWidth - 6 + 2) / 11);
    const want = Math.round(max * pct / 100);
    if (bar.children.length !== want) bar.replaceChildren(...Array.from({ length: want }, () => document.createElement('i')));
  }
  const running = state !== 'done' && state !== 'idle';
  for (const id of ['#pauseBtn', '#cpauseBtn']) { $(id).disabled = !running; $(id).textContent = paused ? 'Resume' : 'Pause'; }
  for (const id of ['#stopBtn', '#cstopBtn']) $(id).textContent = running ? 'Stop' : 'Start...';
}

function dialog(title, html, actions) {
  $('#dlgTitle').textContent = title;
  const body = $('#dlgBody');
  body.innerHTML = html;
  const row = document.createElement('div'); row.className = 'actions';
  for (const [label, fn] of actions) {
    const b = document.createElement('button'); b.className = 'bevel'; b.textContent = label;
    b.onclick = () => { if (fn() !== false) $('#dlg').hidden = true; };
    row.append(b);
  }
  body.append(row);
  $('#dlg').hidden = false;
  row.querySelector('button').focus();
}

function openSelect() {
  const opts = DRIVES.map((d, i) => `<option value="${i}"${d === drive ? ' selected' : ''}>${d.name}</option>`).join('');
  const sp = Object.keys(SPEEDS).map(k => `<option${SPEEDS[k] === speed ? ' selected' : ''}>${k}</option>`).join('');
  dialog('Select Drive', `
    <div class="row"><div class="big">💽</div><div style="flex:1;display:flex;flex-direction:column;gap:8px">
      <div>Which drive do you want to defragment?</div>
      <select id="drvSel">${opts}</select>
      <div class="small">Copyright © 1981–1998 TaterOS. Not a real tool. Your files are fine.</div>
      <div>Speed</div>
      <select id="spdSel">${sp}</select>
      <label class="chk"><input type="checkbox" id="loopChk"${loopMode ? ' checked' : ''}> Start over when finished</label>
    </div></div>`,
    [['OK', () => {
      drive = DRIVES[+$('#drvSel').value];
      speed = SPEEDS[$('#spdSel').value];
      loopMode = $('#loopChk').checked;
      begin();
    }], ['Exit', () => {}]]);
}

function begin() {
  makeDrive();
  paused = false; state = 'read'; acc = 0; stepAcc = 0; lastFile = 0; scanLine = 0;
  document.querySelectorAll('.driveL').forEach(e => e.textContent = drive.id);
  updateUI(); draw();
}

function stop() {
  if (state === 'done' || state === 'idle') return openSelect();
  const was = paused; paused = true; updateUI();
  dialog('Disk Defragmenter', `<div class="row"><div class="big">⚠️</div><div>TaterOS has not finished defragmenting Drive ${drive.id}.<br><br>Do you want to stop?</div></div>`,
    [['Yes', () => { state = 'idle'; paused = false; job = null; updateUI(); openSelect(); return false; }],
     ['No', () => { paused = was; updateUI(); }]]);
}
const togglePause = () => { paused = !paused; updateUI(); };

function showLegend() {
  const items = LEGEND.map(([s, t]) => `<div><canvas data-s="${s}" width="${CW - 1}" height="${CH - 1}"></canvas>${t}</div>`).join('');
  dialog('Defrag Legend', `<div class="legend">${items}</div>
    <div class="small">Each box represents one disk cluster.</div>`, [['Close', () => {}]]);
  document.querySelectorAll('.legend canvas').forEach(c => drawCell({ s: +c.dataset.s }, 0, 0, c.getContext('2d')));
}

$('#stopBtn').onclick = $('#cstopBtn').onclick = stop;
$('#pauseBtn').onclick = $('#cpauseBtn').onclick = togglePause;
$('#legendBtn').onclick = showLegend;
$('#hideBtn').onclick = () => { $('#compact').hidden = false; updateUI(); };
$('#showBtn').onclick = () => { $('#compact').hidden = true; resize(); };
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) $('#dlg').querySelector('.actions button:last-child').click(); });

new ResizeObserver(resize).observe($('#mapWrap'));
resize();
updateUI();
openSelect();
requestAnimationFrame(loop);
</script>
</body>
</html>
